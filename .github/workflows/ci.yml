name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java Reactor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      - name: Build and test
        run: ./mvnw clean install -Djacoco.skip=true -Dexec.skip=true

  renovatio-ui:
    name: renovatio-ui
    runs-on: ubuntu-latest
    needs: java
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'

      - name: Cache npm (ui)
        uses: actions/cache@v4
        with:
          path: renovatio-ui/node_modules
          key: npm-ui-${{ hashFiles('renovatio-ui/package-lock.json') }}
          restore-keys: npm-ui-

      - name: Install and build
        run: |
          cd renovatio-ui
          npm ci
          npm test
          npm run build

  renovatio-workbench:
    name: renovatio-workbench
    runs-on: ubuntu-latest
    needs: java
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'

      - name: Cache npm (workbench)
        uses: actions/cache@v4
        with:
          path: renovatio-workbench/node_modules
          key: npm-wb-${{ hashFiles('renovatio-workbench/package-lock.json') }}
          restore-keys: npm-wb-

      - name: Install and build
        run: |
          cd renovatio-workbench
          npm ci
          npm test
          npm run build

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: renovatio-provider-python
        run: |
          cd renovatio-provider-python
          python -m venv .venv
          source .venv/bin/activate
          pip install -e ".[test]"
          pytest

      - name: Migration spec
        run: |
          cd specs/1-cobol-python-migration
          bash scripts/setup_env.sh
          source .venv/bin/activate
          pytest tests/

  characterization:
    name: Characterization Tests
    runs-on: ubuntu-latest
    needs: java
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      - name: Run characterization tests
        run: ./mvnw verify -pl renovatio-provider-cobol -Djacoco.skip=true -Dexec.skip=true -Dtest="*Characterization*" -Dsurefire.failIfNoSpecifiedTests=false

  equivalence:
    name: Equivalence Tests
    runs-on: ubuntu-latest
    needs: java
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      - name: Run equivalence tests
        run: ./mvnw verify -Djacoco.skip=true -Dexec.skip=true -Dtest="*Equivalence*" -Dsurefire.failIfNoSpecifiedTests=false

  bootstrap:
    name: Bootstrap Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: actions/setup-node@v4
        with:
          node-version: '24.20.0'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-

      - name: Run bootstrap
        run: ./scripts/bootstrap.sh --skip-tests

  pip-audit:
    name: Python Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit renovatio-provider-python
        run: |
          cd renovatio-provider-python
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install -e ".[test]"
          pip install pip-audit
          pip-audit --skip-editable --ignore-vuln PYSEC-2026-196 --ignore-vuln PYSEC-2026-1795 --ignore-vuln PYSEC-2026-1796 --ignore-vuln PYSEC-2026-2875 --ignore-vuln PYSEC-2026-2876 --ignore-vuln PYSEC-2026-3721

      - name: Audit migration spec
        run: |
          cd specs/1-cobol-python-migration
          bash scripts/setup_env.sh
          source .venv/bin/activate
          pip install --upgrade pip
          pip install pip-audit
          pip-audit --ignore-vuln PYSEC-2026-196 --ignore-vuln PYSEC-2026-1795 --ignore-vuln PYSEC-2026-1796 --ignore-vuln PYSEC-2026-2875 --ignore-vuln PYSEC-2026-2876 --ignore-vuln PYSEC-2026-3721
