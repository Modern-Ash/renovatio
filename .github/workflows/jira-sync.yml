# GitHub Actions workflow for Jira synchronization
# Automatically updates Jira tickets when PRs are created, updated, or merged
# Supports smart commits for automated status transitions

name: Jira Sync

on:
  pull_request:
    types: [opened, edited, closed, reopened]
  issues:
    types: [opened, edited, closed, reopened]
  push:
    branches:
      - main
      - develop

jobs:
  sync-jira:
    name: Sync with Jira
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Jira Issue Key
        id: extract-jira-key
        run: |
          # Extract JIRA key from PR/Issue title or commit message
          TITLE="${{ github.event.pull_request.title || github.event.issue.title || github.event.head_commit.message }}"
          JIRA_KEY=$(echo "$TITLE" | grep -oE '[A-Z]+-[0-9]+' | head -1)
          
          if [ -z "$JIRA_KEY" ]; then
            echo "No Jira ticket found in title/commit"
            echo "jira_key=" >> $GITHUB_OUTPUT
          else
            echo "Found Jira ticket: $JIRA_KEY"
            echo "jira_key=$JIRA_KEY" >> $GITHUB_OUTPUT
          fi

      - name: Jira Login
        if: steps.extract-jira-key.outputs.jira_key != ''
        uses: atlassian/gajira-login@v3
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

      - name: Comment on Jira ticket (PR opened)
        if: |
          steps.extract-jira-key.outputs.jira_key != '' && 
          github.event_name == 'pull_request' && 
          github.event.action == 'opened'
        uses: atlassian/gajira-comment@v3
        with:
          issue: ${{ steps.extract-jira-key.outputs.jira_key }}
          comment: |
            🔀 **Pull Request Opened**
            
            📝 PR: [${{ github.event.pull_request.title }}](${{ github.event.pull_request.html_url }})
            👤 Author: @${{ github.event.pull_request.user.login }}
            🌿 Branch: `${{ github.event.pull_request.head.ref }}`
            
            ℹ️ This PR is now ready for review.

      - name: Transition Jira ticket to In Progress (PR opened)
        if: |
          steps.extract-jira-key.outputs.jira_key != '' && 
          github.event_name == 'pull_request' && 
          github.event.action == 'opened'
        uses: atlassian/gajira-transition@v3
        with:
          issue: ${{ steps.extract-jira-key.outputs.jira_key }}
          transition: "In Progress"
        continue-on-error: true

      - name: Comment on Jira ticket (PR merged)
        if: |
          steps.extract-jira-key.outputs.jira_key != '' && 
          github.event_name == 'pull_request' && 
          github.event.pull_request.merged == true
        uses: atlassian/gajira-comment@v3
        with:
          issue: ${{ steps.extract-jira-key.outputs.jira_key }}
          comment: |
            ✅ **Pull Request Merged**
            
            📝 PR: [${{ github.event.pull_request.title }}](${{ github.event.pull_request.html_url }})
            👤 Merged by: @${{ github.event.pull_request.merged_by.login }}
            🎯 Into branch: `${{ github.event.pull_request.base.ref }}`
            📦 Commit: ${{ github.event.pull_request.merge_commit_sha }}
            
            ✅ Changes have been integrated successfully.

      - name: Transition Jira ticket to Done (PR merged)
        if: |
          steps.extract-jira-key.outputs.jira_key != '' && 
          github.event_name == 'pull_request' && 
          github.event.pull_request.merged == true
        uses: atlassian/gajira-transition@v3
        with:
          issue: ${{ steps.extract-jira-key.outputs.jira_key }}
          transition: "Done"
        continue-on-error: true

      - name: Comment on Jira ticket (Issue created)
        if: |
          steps.extract-jira-key.outputs.jira_key != '' && 
          github.event_name == 'issues' && 
          github.event.action == 'opened'
        uses: atlassian/gajira-comment@v3
        with:
          issue: ${{ steps.extract-jira-key.outputs.jira_key }}
          comment: |
            🐛 **GitHub Issue Created**
            
            📝 Issue: [${{ github.event.issue.title }}](${{ github.event.issue.html_url }})
            👤 Reporter: @${{ github.event.issue.user.login }}
            🏷️ Labels: ${{ join(github.event.issue.labels.*.name, ', ') }}
            
            View details on GitHub: ${{ github.event.issue.html_url }}

      - name: Comment on Jira ticket (Issue closed)
        if: |
          steps.extract-jira-key.outputs.jira_key != '' && 
          github.event_name == 'issues' && 
          github.event.action == 'closed'
        uses: atlassian/gajira-comment@v3
        with:
          issue: ${{ steps.extract-jira-key.outputs.jira_key }}
          comment: |
            ✅ **GitHub Issue Closed**
            
            📝 Issue: [${{ github.event.issue.title }}](${{ github.event.issue.html_url }})
            👤 Closed by: @${{ github.actor }}
            
            This issue has been resolved on GitHub.

      - name: Add Jira link to PR description
        if: |
          steps.extract-jira-key.outputs.jira_key != '' && 
          github.event_name == 'pull_request' && 
          github.event.action == 'opened'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const jiraKey = '${{ steps.extract-jira-key.outputs.jira_key }}';
            const jiraBaseUrl = '${{ secrets.JIRA_BASE_URL }}';
            const prBody = context.payload.pull_request.body || '';
            
            // Check if Jira link already exists
            if (!prBody.includes(jiraBaseUrl)) {
              const jiraLink = `\n\n---\n\n**Jira Ticket:** [${jiraKey}](${jiraBaseUrl}/browse/${jiraKey})`;
              const updatedBody = prBody + jiraLink;
              
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                body: updatedBody
              });
            }

  validate-specs:
    name: Validate Spec Files
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' && 
      contains(github.event.pull_request.changed_files, 'docs/specs/')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check for spec file changes
        id: check-specs
        run: |
          # Check if any spec files were modified
          SPEC_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep 'docs/specs/.*\.md' || true)
          if [ -n "$SPEC_FILES" ]; then
            echo "Spec files changed:"
            echo "$SPEC_FILES"
            echo "has_spec_changes=true" >> $GITHUB_OUTPUT
            echo "spec_files=$SPEC_FILES" >> $GITHUB_OUTPUT
          else
            echo "No spec files changed"
            echo "has_spec_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate spec metadata
        if: steps.check-specs.outputs.has_spec_changes == 'true'
        run: |
          echo "Validating spec file metadata..."
          
          # Simple validation - check for required frontmatter
          for file in ${{ steps.check-specs.outputs.spec_files }}; do
            if [ -f "$file" ]; then
              echo "Checking $file..."
              
              # Check for YAML frontmatter
              if ! grep -q '^---$' "$file"; then
                echo "❌ Error: $file is missing YAML frontmatter"
                exit 1
              fi
              
              # Check for required fields
              if ! grep -q 'title:' "$file"; then
                echo "❌ Error: $file is missing 'title' field"
                exit 1
              fi
              
              echo "✅ $file validation passed"
            fi
          done
          
          echo "✅ All spec files validated successfully"

      - name: Comment validation results
        if: steps.check-specs.outputs.has_spec_changes == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const comment = `
            ✅ **Spec File Validation Passed**
            
            The following specification files were validated:
            \`\`\`
            ${{ steps.check-specs.outputs.spec_files }}
            \`\`\`
            
            All spec files contain the required metadata and follow the correct format.
            `;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: comment
            });
