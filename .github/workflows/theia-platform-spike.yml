name: Theia platform spike

on:
  pull_request:
    paths:
      - 'renovatio-workbench/**'
      - '.github/workflows/theia-platform-spike.yml'
  push:
    branches: [main]
    paths:
      - 'renovatio-workbench/**'

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: renovatio-workbench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: renovatio-workbench/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run smoke
      - run: npm prune --omit=dev
      - run: npm audit --omit=dev --audit-level=high
