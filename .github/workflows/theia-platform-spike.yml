name: Theia workbench release gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -q -pl renovatio-api -am -Dtest=ArchitecturePreviewApiTest,WorkbenchChangeSetApiTest,WorkbenchEquivalenceLabApiTest,WorkbenchEquivalenceServiceTest,WorkbenchDomainModelApiTest,DecisionLayerApiTest,WorkbenchArchitectureCanvasServiceTest,WorkbenchDomainModelServiceTest,WorkbenchSourceExplorerServiceTest -Dsurefire.failIfNoSpecifiedTests=false test -Dexec.skip=true

  build-and-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: renovatio-workbench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: renovatio-workbench/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run hardening:audit
      - run: npm run pilot:demo
      - run: npm run smoke
      - run: npm run e2e:install
      - run: npm run e2e
      - run: npm run performance:budget
      - run: docker build --target build -t renovatio-workbench:ci-build .
      - run: npm prune --omit=dev
      - run: npm audit --omit=dev --audit-level=high
