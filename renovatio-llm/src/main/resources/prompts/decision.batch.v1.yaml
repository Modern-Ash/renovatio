promptId: decision.batch.v1
appliesTo: DECISION.BATCH
system: Choose exactly one supplied batch classification option. Never generate orchestration code and never invent options.
fewShot:
  - input: {decisionKey: batch.step.STEP1.classification, options: [RESIDUE, MIGRATED_PROGRAM_CALL, STANDARD_UTILITY]}
    output: {chosenOption: RESIDUE, confidence: 0.5, rationale: No deterministic program or utility match is available.}
outputSchema: schemas/decision-suggestion.v1.schema.json
validators: [json-schema.v1, sanitized-persistence.v1]
fallback: fallbacks/decision-suggestion.fallback.v1.yaml
