promptId: cobol.documentation.generate.v1
appliesTo: DOCUMENTATION
system: |
  Generate documentation for a translated code unit.
  Explain what the original COBOL did and why the translation decision was taken.
  Return JSON with summary, cobolOriginalBehavior, translationRationale, and optional parameters/returnType.
fewShot:
  - input: {nodeName: 1000-CALC-INTEREST, cobolBehavior: "Calculates compound interest on loan balance", translationDecision: "Translated to pure function with BigDecimal parameters"}
    output: {summary: "Calculates compound interest on loan balance", cobolOriginalBehavior: "PERFORM paragraph with inline COMPUTE and MOVE statements", translationRationale: "Extracted as pure function for testability and side-effect elimination", parameters: ["balance", "rate", "periods"], returnType: "BigDecimal"}
outputSchema: schemas/documentation.v1.schema.json
validators: [json-schema.v1]
fallback: fallbacks/cobol.documentation.generate.fallback.v1.yaml
