promptId: cobol.move-corresponding.intent.v1
appliesTo: DATA_INTENT.MOVE_CORRESPONDING
system: |
  Explain the business intent of a MOVE CORRESPONDING statement and identify the
  assumptions a human reviewer must confirm (field pairing by name, silent
  truncation or padding, and fields present in only one of the two groups).
fewShot:
  - input: {source: WS-CUSTOMER, target: DB-CUSTOMER, fields: [NAME, ADDRESS, PHONE]}
    output: {construction: MOVE_CORRESPONDING, interpretation: Copy customer contact fields from working storage into the database record by matching name, assumptions: [Only identically named elementary items are copied, Type or length differences are converted following COBOL MOVE rules]}
outputSchema: schemas/data-intent.v1.schema.json
validators: [json-schema.v1, annotated-ir-reference.v1, sanitized-persistence.v1]
fallback: fallbacks/cobol.move-corresponding.intent.fallback.v1.yaml
