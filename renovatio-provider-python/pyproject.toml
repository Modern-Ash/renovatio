[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "renovatio-provider-python"
version = "0.0.1"
description = "Unsupported Renovatio Python lab package: COBOL runtime/PIC mirror research only; not a TargetEmitter or COBOL-to-Python generator."
requires-python = ">=3.10"
dependencies = ["jinja2>=3.0", "jsonschema>=4.0"]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/renovatio_python"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
