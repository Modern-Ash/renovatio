server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:renovatio-db;MODE=LEGACY;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 200MB
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

renovatio:
  api:
    async:
      core-pool-size: 4
      max-pool-size: 8
      queue-capacity: 100
