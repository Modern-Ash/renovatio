spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: false
renovatio:
  reusable-assets:
    root: ${java.io.tmpdir}/renovatio-api-tests-${random.uuid}
debug: false
logging:
  level:
    org.hibernate.SQL: INFO
    org.springframework: INFO
