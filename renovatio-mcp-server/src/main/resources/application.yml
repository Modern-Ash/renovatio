server:
  port: 8082

spring:
  application:
    name: renovatio-mcp-server
  main:
    banner-mode: console

# MCP Server Configuration
mcp:
  server:
    name: "Renovatio MCP Server"
    version: "1.0.0"
    description: "Multi-language refactoring and migration platform with full MCP compliance"
    protocol-version: "2025-06-18"
  
  # MCP Capabilities Configuration
  capabilities:
    tools: true
    prompts: true
    resources: true
    content:
      read: true
      write: true
    workspace:
      list: true
      describe: true
    logging:
      subscribe: true

# Language Provider Configuration
renovatio:
  # Default language filter (optional: java, cobol, or empty for all)
  # Can be overridden by RENOVATIO_DEFAULT_LANGUAGE environment variable
  default-language: ${RENOVATIO_DEFAULT_LANGUAGE:}
  
  providers:
    java:
      enabled: true
      recipes-path: "classpath:recipes/java"
    cobol:
      enabled: true
      recipes-path: "classpath:recipes/cobol"

  # Recipe Configuration
  recipes:
    format: "unified"  # Use unified recipe format across all languages
    base-path: "classpath:recipes"

# Actuator endpoints for monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Logging Configuration
logging:
  level:
    root: INFO
    org.shark.renovatio: INFO
    org.shark.renovatio.mcp.server: INFO
    org.openrewrite: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"